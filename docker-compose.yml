services:
  app:
    build: .
    container_name: accounting_assistant_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/frontend/dist
  n8n:
    image: n8nio/n8n:latest
    container_name: accounting_assistant_n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Australia/Melbourne
      - TZ=Australia/Melbourne
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - app

volumes:
  n8n_data:
